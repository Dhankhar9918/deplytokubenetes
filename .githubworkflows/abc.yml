name: docker build and deploy cont

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/deploytokubenetes:dheeraj .

      # 4. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/deploytokubenetes:dheeraj

      # 5. Login to EC2
      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Connected to EC2"

            # Check Kubernetes
            kubectl get nodes

            # Create/update deployment
            kubectl apply -f deployment.yaml

            # Create/update service
            kubectl apply -f service.yaml

            # Restart deployment to pull latest image
            kubectl rollout restart deployment my-website

            # Check pods
            kubectl get pods

            # Check service
            kubectl get svc my-website-service
